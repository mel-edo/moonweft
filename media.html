<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Gallery ~ moonweft</title>
    <link rel="stylesheet" href="styles/media.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
</head>

<body class="retro-body">

    <!-- Background Watermark Ring Accent -->
    <div class="bg-ring-accent"></div>

    <!-- Top Navigation -->
    <nav class="sg-nav">
        <a href="index.html" class="nav-tab"><span class="sg-nav-text">HOME</span></a>
        <a href="projects.html" class="nav-tab"><span class="sg-nav-text">PROJECTS</span></a>
        <span class="active nav-tab"><span class="sg-nav-text">MEDIA</span></span>
        <a href="community.html" class="nav-tab"><span class="sg-nav-text">BOARD</span></a>
        <a href="notes.html" class="nav-tab"><span class="sg-nav-text">BLOG</span></a>
    </nav>

    <!-- Page Title Banner -->
    <header class="page-header">
        <h1>MEDIA GALLERY</h1>
    </header>

    <!-- Main Container: Sidebar + Stream -->
    <div class="gallery-container">
        
        <!-- Retro Timeline Sidebar -->
        <aside class="timeline-sidebar win-box">
            <div class="win-title-bar">
                <span class="win-title">TIMELINE</span>
            </div>
            <div class="win-content">
                <ul id="timeline-menu">
                    <!-- Dynamic timeline links generated via JS -->
                </ul>
            </div>
        </aside>

        <!-- Gallery Stream -->
        <main id="gallery-stream" class="gallery-stream">
            <!-- Dynamic month sections generated via JS -->
        </main>
    </div>

    <!-- Retro Lightbox Modal -->
    <div id="sg-lightbox" class="sg-lightbox">
        <div class="sg-lightbox-content win-box">
            <div class="win-title-bar">
                <span id="lightbox-title-text" class="win-title">image_preview.png</span>
                <span class="sg-close-btn win-close">&times;</span>
            </div>
            <div class="lightbox-img-frame">
                <img id="sg-lightbox-img" src="" alt="Expanded View">
            </div>
            <div id="sg-lightbox-caption" class="lightbox-caption"></div>
        </div>
    </div>

    <!-- Footer with classic Neocities badges -->
    <footer class="page-footer">
        <div class="footer-rings">
            <span class="ring-dot red">★</span>
            <span class="ring-dot gold">●</span>
            <span class="ring-dot white">★</span>
        </div>
        <p class="footer-text">MOONWEFT MEDIA ARCHIVE // ALL RIGHTS RESERVED</p>
    </footer>

    <!-- Return to Top Button -->
    <button id="back-to-top" class="back-to-top-btn win-box" aria-label="Back to top">
        <span class="arrow-up">▲</span>
    </button>

    <!-- Joker Transition Elements (Preserved) -->
    <iframe id="secret-projects-frame" src="projects.html" style="opacity: 0; pointer-events: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border: none; z-index: 2147483646;"></iframe>
    <div id="transition-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2147483647; pointer-events: none;">
        <video id="joker-transition" muted playsinline style="width: 100%; height: 100%; object-fit: cover;">
            <source src="assets/joker.webm" type="video/webm">
        </video>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const galleryStream = document.getElementById('gallery-stream');
            const timelineMenu = document.getElementById('timeline-menu');

            // Single source of truth for "which year is expanded"
            let currentTrackedYear = null;

            function setActiveYear(year) {
                currentTrackedYear = year;
                document.querySelectorAll('.year-group').forEach(yg => {
                    const match = yg.dataset.year === year;
                    yg.classList.toggle('open', match);
                    yg.classList.toggle('active', match);
                });
            }

            // Back to Top Button
            const backToTopBtn = document.getElementById('back-to-top');
            if (backToTopBtn) {
                let btnTicking = false;

                window.addEventListener('scroll', () => {
                    if (!btnTicking) {
                        requestAnimationFrame(() => {
                            backToTopBtn.classList.toggle('visible', window.scrollY > 400);
                            btnTicking = false;
                        });
                        btnTicking = true;
                    }
                });

                backToTopBtn.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            async function loadGallery() {
                try {
                    const response = await fetch('data/gallery-data.json');
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    renderGallery(data);
                } catch (error) {
                    console.error("Failed to load gallery data:", error);
                    if (galleryStream) {
                        galleryStream.innerHTML = `
                            <div class="win-box error-box">
                                <div class="win-title-bar"><span class="win-title">SYSTEM ERROR</span></div>
                                <p style="padding: 1.5rem; font-family: 'VT323', monospace; font-size: 1.3rem;">
                                    [ CONNECTION FAILED ] // GALLERY DATA OFFLINE
                                </p>
                            </div>`;
                    }
                }
            }

            function renderGallery(images) {
                galleryStream.innerHTML = '';
                timelineMenu.innerHTML = '';

                images.sort((a, b) => new Date(b.date) - new Date(a.date));

                const yearGroups = {};
                images.forEach(img => {
                    const dateObj = new Date(img.date);
                    const year = dateObj.getFullYear().toString();
                    const month = dateObj.toLocaleString('en-US', { month: 'long' });

                    if (!yearGroups[year]) yearGroups[year] = {};
                    if (!yearGroups[year][month]) yearGroups[year][month] = [];
                    yearGroups[year][month].push(img);
                });

                const monthNames = [
                    "January", "February", "March", "April", "May", "June",
                    "July", "August", "September", "October", "November", "December"
                ];

                const sortedYears = Object.keys(yearGroups).sort((a, b) => Number(b) - Number(a));

                sortedYears.forEach((year) => {
                    const yearLi = document.createElement('li');
                    // No inline 'open active' here anymore — setActiveYear() handles it after render
                    yearLi.className = 'year-group';
                    yearLi.dataset.year = year;

                    const sortedMonths = Object.keys(yearGroups[year]).sort((a, b) => {
                        return monthNames.indexOf(b) - monthNames.indexOf(a);
                    });

                    const monthListHTML = sortedMonths.map((month) => {
                        const sectionId = `section-${year}-${month.toLowerCase()}`;
                        return `
                            <li>
                                <a href="#${sectionId}" class="timeline-link" data-year="${year}">
                                    <span class="bullet">▶</span> ${month.toUpperCase()}
                                </a>
                            </li>
                        `;
                    }).join('');

                    yearLi.innerHTML = `
                        <button class="year-header">
                            <span class="arrow-icon">▶</span> ${year}
                        </button>
                        <ul class="month-sub-menu">
                            ${monthListHTML}
                        </ul>
                    `;

                    // Manual year click: expand this year, collapse the rest
                    const yearBtn = yearLi.querySelector('.year-header');
                    yearBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        setActiveYear(year);
                        const firstSection = document.querySelector(`.month-section[data-year="${year}"]`);
                        if (firstSection) {
                            firstSection.scrollIntoView({ behavior: 'smooth' });
                        }
                    });

                    // Manual month click: expand its year immediately, then smooth-scroll
                    yearLi.querySelectorAll('.timeline-link').forEach(link => {
                        link.addEventListener('click', (e) => {
                            e.preventDefault();
                            setActiveYear(link.dataset.year);
                            const targetId = link.getAttribute('href').substring(1);
                            const targetSection = document.getElementById(targetId);
                            if (targetSection) {
                                targetSection.scrollIntoView({ behavior: 'smooth' });
                            }
                        });
                    });

                    timelineMenu.appendChild(yearLi);

                    sortedMonths.forEach(month => {
                        const sectionId = `section-${year}-${month.toLowerCase()}`;
                        const section = document.createElement('section');
                        section.id = sectionId;
                        section.className = 'month-section';
                        section.dataset.year = year;

                        let cardsHTML = yearGroups[year][month].map(img => {
                            const date = new Date(img.date).toLocaleDateString('en-US', {
                                month: 'short', day: 'numeric', year: 'numeric'
                            });
                            const thumbSrc = img.thumb || img.url;
                            return `
                                <div class="photo-card win-box-card" data-full="${img.url}" data-date="${date}" data-id="${img.id}">
                                    <div class="img-wrapper">
                                        <img src="${thumbSrc}" loading="lazy" decoding="async" alt="${img.alt}">
                                    </div>
                                    <div class="photo-info">
                                        <span class="photo-label">${date}</span>
                                        <span class="photo-date">${img.id}</span>
                                    </div>
                                </div>
                            `;
                        }).join('');

                        section.innerHTML = `
                            <div class="section-header">
                                <h2 class="month-heading">${month.toUpperCase()} ${year}</h2>
                                <div class="section-line"></div>
                            </div>
                            <div class="photo-grid">${cardsHTML}</div>
                        `;
                        galleryStream.appendChild(section);
                    });
                });

                // Expand the newest year by default (matches what's actually in view at load)
                setActiveYear(sortedYears[0]);

                initLightbox();
                initScrollSpy();
            }

            function initLightbox() {
                const lightbox = document.getElementById('sg-lightbox');
                const lightboxContent = document.querySelector('.sg-lightbox-content');
                const lightboxImg = document.getElementById('sg-lightbox-img');
                const lightboxCaption = document.getElementById('sg-lightbox-caption');
                const lightboxTitle = document.getElementById('lightbox-title-text');
                const closeBtn = document.querySelector('.sg-close-btn');
                const imgFrame = document.querySelector('.lightbox-img-frame');

                let currentCard = null;
                let currentNaturalW = 0;
                let currentNaturalH = 0;

                function computeFittedSize(nw, nh) {
                    const isMobile = window.innerWidth <= 600;
                    const maxW = isMobile ? Math.floor(window.innerWidth * 0.92) : Math.min(Math.floor(window.innerWidth * 0.88), 1150);
                    const maxH = isMobile ? Math.floor(window.innerHeight * 0.62) : Math.floor(window.innerHeight * 0.68);
                    const aspect = (nw && nh) ? (nw / nh) : (4 / 3);

                    let targetW = maxW;
                    let targetH = targetW / aspect;
                    if (targetH > maxH) {
                        targetH = maxH;
                        targetW = targetH * aspect;
                    }
                    const minW = isMobile ? Math.min(260, Math.floor(window.innerWidth * 0.92)) : 340;
                    targetW = Math.max(Math.round(targetW), minW);
                    targetH = Math.round(targetH);

                    return {
                        width: targetW,
                        height: targetH
                    };
                }

                function updateFrameDimensions(nw, nh) {
                    if (!imgFrame) return;
                    currentNaturalW = nw;
                    currentNaturalH = nh;
                    const { width, height } = computeFittedSize(nw, nh);
                    if (lightboxContent) {
                        lightboxContent.style.width = `${width}px`;
                    }
                    imgFrame.style.height = `${height}px`;
                }

                function openPhoto(card) {
                    if (!card) return;
                    currentCard = card;
                    const img = card.querySelector('img');
                    const date = card.dataset.date;
                    const id = card.dataset.id;
                    const fullSrc = card.dataset.full || (img ? img.src : '');
                    if (!img || !fullSrc) return;

                    const nw = img.naturalWidth || 800;
                    const nh = img.naturalHeight || 600;
                    const isAlreadyOpen = lightbox.classList.contains('active');

                    if (!isAlreadyOpen) {
                        // Opening fresh from gallery: snap frame immediately to target dimensions without morphing from previous photo
                        if (lightboxContent) lightboxContent.style.transition = 'none';
                        imgFrame.style.transition = 'none';
                        updateFrameDimensions(nw, nh);
                        void imgFrame.offsetHeight; // Force layout
                        requestAnimationFrame(() => {
                            if (lightboxContent) lightboxContent.style.transition = '';
                            imgFrame.style.transition = '';
                        });
                    } else {
                        // Already open (navigating between photos with arrows):
                        updateFrameDimensions(nw, nh);
                    }

                    // Always ensure opacity starts at 0 so it never pops in abruptly
                    lightboxImg.style.opacity = '0';

                    // Update captions and title
                    lightboxCaption.innerHTML = `<span class="caption-date">${date}</span> <span class="caption-id">// ${id}</span>`;
                    lightboxTitle.innerText = `${id}.webp`;
                    lightbox.classList.add('active');
                    document.body.classList.add('modal-open');

                    const triggerFadeIn = () => {
                        requestAnimationFrame(() => {
                            lightboxImg.style.opacity = '1';
                        });
                    };

                    // Set thumbnail source
                    lightboxImg.alt = img.alt || 'Expanded View';
                    lightboxImg.src = img.src;

                    // Fade in smoothly only after decoding finishes (ensures zero popping)
                    if (lightboxImg.decode) {
                        lightboxImg.decode().catch(() => {}).then(triggerFadeIn);
                    } else if (lightboxImg.complete) {
                        triggerFadeIn();
                    } else {
                        lightboxImg.onload = triggerFadeIn;
                    }

                    // Preload full resolution image
                    if (fullSrc !== img.src) {
                        const fullImage = new Image();
                        fullImage.src = fullSrc;
                        fullImage.onload = () => {
                            if (lightbox.classList.contains('active') && lightboxTitle.innerText === `${id}.webp`) {
                                // Only update frame if aspect ratio actually differs by > 2%
                                const thumbAspect = nw / nh;
                                const fullAspect = (fullImage.naturalWidth && fullImage.naturalHeight)
                                    ? (fullImage.naturalWidth / fullImage.naturalHeight)
                                    : thumbAspect;
                                if (Math.abs(thumbAspect - fullAspect) > 0.02) {
                                    updateFrameDimensions(fullImage.naturalWidth, fullImage.naturalHeight);
                                }
                                // Decode full image before swap to prevent any flash or pop
                                if (fullImage.decode) {
                                    fullImage.decode().catch(() => {}).then(() => {
                                        if (lightbox.classList.contains('active') && lightboxTitle.innerText === `${id}.webp`) {
                                            lightboxImg.src = fullSrc;
                                        }
                                    });
                                } else {
                                    lightboxImg.src = fullSrc;
                                }
                            }
                        };
                    }
                }

                galleryStream.addEventListener('click', (e) => {
                    const card = e.target.closest('.photo-card');
                    if (card) openPhoto(card);
                });

                const closeAction = () => {
                    lightbox.classList.remove('active');
                    document.body.classList.remove('modal-open');
                    lightboxImg.style.opacity = '0';
                    setTimeout(() => {
                        if (!lightbox.classList.contains('active')) {
                            lightboxImg.src = '';
                            currentCard = null;
                            if (lightboxContent) {
                                lightboxContent.style.transition = 'none';
                                lightboxContent.style.width = '';
                            }
                            if (imgFrame) {
                                imgFrame.style.transition = 'none';
                                imgFrame.style.width = '';
                                imgFrame.style.height = '';
                            }
                        }
                    }, 250);
                };

                closeBtn.addEventListener('click', closeAction);
                lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeAction(); });
                
                document.addEventListener('keydown', (e) => {
                    if (!lightbox.classList.contains('active')) return;
                    if (e.key === 'Escape') {
                        closeAction();
                    } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        if (currentCard) {
                            const allCards = Array.from(document.querySelectorAll('.photo-card'));
                            const idx = allCards.indexOf(currentCard);
                            if (idx >= 0 && idx < allCards.length - 1) {
                                openPhoto(allCards[idx + 1]);
                            }
                        }
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        if (currentCard) {
                            const allCards = Array.from(document.querySelectorAll('.photo-card'));
                            const idx = allCards.indexOf(currentCard);
                            if (idx > 0) {
                                openPhoto(allCards[idx - 1]);
                            }
                        }
                    }
                });

                window.addEventListener('resize', () => {
                    if (lightbox.classList.contains('active') && currentNaturalW && currentNaturalH) {
                        updateFrameDimensions(currentNaturalW, currentNaturalH);
                    }
                });
            }

            // ScrollSpy: expands whichever year's section is currently in view, collapses the rest
            function initScrollSpy() {
                const sections = document.querySelectorAll('.month-section');
                const navLinks = document.querySelectorAll('.timeline-link');
                let ticking = false;

                function updateOnScroll() {
                    let currentSectionId = '';
                    let currentYear = '';

                    sections.forEach(section => {
                        if (window.scrollY >= (section.offsetTop - 160)) {
                            currentSectionId = section.getAttribute('id');
                            currentYear = section.dataset.year;
                        }
                    });

                    navLinks.forEach(link => {
                        link.classList.toggle('active', link.getAttribute('href') === `#${currentSectionId}`);
                    });

                    if (currentYear && currentYear !== currentTrackedYear) {
                        setActiveYear(currentYear);
                    }
                    ticking = false;
                }

                window.addEventListener('scroll', () => {
                    if (!ticking) {
                        requestAnimationFrame(updateOnScroll);
                        ticking = true;
                    }
                });
            }

            loadGallery();

            // Joker Transition Logic (unchanged)
            const projectLinks = document.querySelectorAll('a[href="projects.html"]');
            const videoOverlay = document.getElementById('transition-overlay');
            const video = document.getElementById('joker-transition');
            const secretFrame = document.getElementById('secret-projects-frame');

            if (projectLinks.length > 0 && video && secretFrame) {
                projectLinks.forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        videoOverlay.style.display = 'block';
                        videoOverlay.style.pointerEvents = 'auto';
                        video.play();
                        setTimeout(() => { secretFrame.style.opacity = '1'; }, 800);
                        video.addEventListener('ended', () => {
                            sessionStorage.setItem('heistSuccess', 'true');
                            window.location.href = link.href;
                        }, { once: true });
                    });
                });
            }
        });
    </script>
</body>
</html>
